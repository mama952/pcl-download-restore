name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            'src/PCLRestore',
            'src/Verify',
            'src/PatchSkin',
            'tools/Patcher',
            'tools/Restore2991',
            'tools/Inspect'
          )
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($p in $projects) {
            $proj = Get-ChildItem $p -Filter *.csproj | Select-Object -First 1
            dotnet publish $proj.FullName -c Release -r win-x64 --self-contained false `
              -p:PublishSingleFile=true -o dist/_tmp
            if ($LASTEXITCODE -ne 0) { throw "build failed: $p" }
            Copy-Item dist/_tmp/*.exe dist -Force
            Remove-Item dist/_tmp -Recurse -Force
          }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: dist-win-x64
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
